name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - run: gh release create "$env:GITHUB_REF_NAME" (Get-Item dist/*.exe).FullName --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
